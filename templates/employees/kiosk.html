<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Kiosk</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:900px;
    text-align:center;
}

video{
    width:700px;
    border-radius:15px;
    border:5px solid white;
    transform: scaleX(-1);
}

canvas{
    display:none;
}

#status{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
}

.success{
    color:#00ff88;
}

.error{
    color:#ff5555;
}

.scanning{
    color:orange;
}

</style>

</head>
<body>

<div class="container">

<h1>Face Attendance System</h1>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="status" class="scanning">
Looking for face...
</div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusDiv = document.getElementById("status");

navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    }
})
.then(stream=>{
    video.srcObject=stream;
})
.catch(()=>{
    statusDiv.innerHTML="Camera Permission Denied";
});

let processing=false;

async function captureAndSend(){

    if(processing) return;

    if(video.readyState!==4) return;

    processing=true;

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();

    const image=canvas.toDataURL("image/jpeg");

    const formData=new FormData();
    formData.append("image",image);

    try{

        const response=await fetch("/mark-attendance/",{

            method:"POST",

            headers:{
                "X-CSRFToken":"{{ csrf_token }}"
            },

            body:formData

        });

        const data=await response.json();

        if(data.success){

            statusDiv.className="success";

            statusDiv.innerHTML=
            data.message+
            "<br>"+data.time;

            setTimeout(()=>{
                statusDiv.className="scanning";
                statusDiv.innerHTML="Looking for face...";
            },4000);

        }

        else{

            statusDiv.className="error";
            statusDiv.innerHTML=data.error;

            setTimeout(()=>{
                statusDiv.className="scanning";
                statusDiv.innerHTML="Looking for face...";
            },2000);

        }

    }

    catch(e){

        console.log(e);

    }

    processing=false;

}

setInterval(captureAndSend,2500);

</script>

</body>
</html>
