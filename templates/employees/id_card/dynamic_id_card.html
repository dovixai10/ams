{% extends layout_path %}

{% block title %}ID Card Generator | Admin{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row mb-3">
    <div class="col-12">
      <h2 class="mb-1"><i class="bx bx-id-card me-2"></i>Employee ID Card Studio</h2>
      <p class="text-muted mb-0">Preview and download use the same unified card component.</p>
    </div>
  </div>
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header"><h5 class="mb-0">Select employee</h5></div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Employee</label>
            <select id="employeeSelect" class="form-select">
              <option value="">— Select —</option>
              {% for emp in employees %}
              <option value="{{ emp.id }}">{{ emp.full_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Employee code</label>
            <input type="text" id="employeeCode" class="form-control" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Designation</label>
            <input type="text" id="employeeDesignation" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Date of joining</label>
            <input type="date" id="employeeJoining" class="form-control">
          </div>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary" id="previewBtn" disabled>
              <i class="bx bx-show me-1"></i>Refresh preview
            </button>
            <button type="button" class="btn btn-primary" id="downloadBtn" disabled>
              <i class="bx bx-download me-1"></i>Download PDF
            </button>
          </div>
          <div id="errorBox" class="alert alert-danger d-none mt-3 small"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Live preview</h5>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.querySelector('.ams-id-card-inner')?.classList.toggle('is-flipped')">
            <i class="bx bx-refresh"></i> Flip
          </button>
        </div>
        <div class="card-body bg-light" id="previewHost">
          <p class="text-muted text-center py-5 mb-0">Select an employee to preview their ID card.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const sel = document.getElementById('employeeSelect');
  const previewBtn = document.getElementById('previewBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const previewHost = document.getElementById('previewHost');
  const errorBox = document.getElementById('errorBox');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('d-none');
  }
  function clearError() {
    errorBox.classList.add('d-none');
  }

  async function loadMeta() {
    const id = sel.value;
    if (!id) {
      previewBtn.disabled = true;
      downloadBtn.disabled = true;
      return;
    }
    clearError();
    const res = await fetch(`{% url 'employees:get_employee_data_api' %}?employee_id=${id}`);
    const data = await res.json();
    if (!data.success) {
      showError(data.error || 'Could not load employee.');
      return;
    }
    document.getElementById('employeeCode').value = data.employee_code;
    document.getElementById('employeeDesignation').value = data.employee_designation;
    document.getElementById('employeeJoining').value = data.employee_joining_date_iso || '';
    previewBtn.disabled = false;
    downloadBtn.disabled = false;
    refreshPreview();
  }

  async function refreshPreview() {
    const id = sel.value;
    if (!id) return;
    previewHost.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    const params = new URLSearchParams({
      employee_id: id,
      employee_code: document.getElementById('employeeCode').value,
      job_position: document.getElementById('employeeDesignation').value,
      date_of_joining: document.getElementById('employeeJoining').value,
    });
    const res = await fetch(`{% url 'employees:id_card_preview' %}?${params}`);
    if (!res.ok) {
      showError('Preview failed.');
      return;
    }
    previewHost.innerHTML = await res.text();
  }

  async function downloadPdf() {
    const id = sel.value;
    if (!id) return;
    clearError();
    downloadBtn.disabled = true;
    try {
      const res = await fetch(`{% url 'employees:id_card_download_pdf' %}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': '{{ csrf_token }}',
        },
        body: JSON.stringify({
          employee_id: id,
          employee_code: document.getElementById('employeeCode').value,
          job_position: document.getElementById('employeeDesignation').value,
          date_of_joining: document.getElementById('employeeJoining').value,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showError(err.error || 'Download failed.');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ID_Card_${document.getElementById('employeeCode').value || id}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } finally {
      downloadBtn.disabled = false;
    }
  }

  sel.addEventListener('change', loadMeta);
  previewBtn.addEventListener('click', refreshPreview);
  downloadBtn.addEventListener('click', downloadPdf);
})();
</script>
{% endblock %}
