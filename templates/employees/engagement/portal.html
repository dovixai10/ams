{% extends layout_path %}

{% block title %}Engagement{% endblock %}

{% block content %}
<div class="container py-4">
  <h4 class="mb-4">Engagement</h4>
  <div class="row g-3">
    {% for program in programs %}
    <div class="col-md-6 col-lg-4">
      <a href="{% url 'employees:engagement_program_detail' program.pk %}" class="card shadow-sm h-100 text-decoration-none text-body">
        <div class="card-body">
          <span class="badge bg-label-primary mb-2">{{ program.get_program_type_display }}</span>
          <h6>{{ program.title }}</h6>
          <p class="small text-muted mb-0">{{ program.body|truncatewords:20 }}</p>
        </div>
      </a>
    </div>
    {% empty %}
    <p class="text-muted">No active programs right now.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
