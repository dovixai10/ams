[project]
name = "ems-prakhar"
version = "0.1.0"
description = "Django employee attendance management system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "Django==4.2.20",
    "django-widget-tweaks==1.5.0",

    "psycopg[binary]==3.3.4",

    "dlib==20.0.1",
    "face-recognition==1.3.0",
    "face_recognition_models==0.3.0",

    "gunicorn==26.0.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==10.4.0",

    "python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 120